# Perfil de tests: H2 en memoria en modo PostgreSQL; el esquema lo genera Hibernate
# (las migraciones Flyway usan plpgsql y no corren en H2).
spring:
  datasource:
    url: jdbc:h2:mem:identifyr;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  # Parámetros y feriados del motor de crédito: se cargan después de que Hibernate crea el esquema
  sql:
    init:
      mode: always
      data-locations: classpath:test-credit-data.sql

logging:
  level:
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO

# Secreto solo para tests (en main no hay valor por defecto)
jwt:
  secret: test-secret-solo-para-tests-0123456789abcdef0123456789

# Holgado: muchos tests de login comparten la IP 127.0.0.1 (el límite se prueba en AuthRateLimitTest)
rate-limit:
  phone-lookup:
    max-requests: 100000
  user-register:
    max-requests: 100000
  auth-login:
    max-requests: 100000
  register-password:
    max-requests: 100000
